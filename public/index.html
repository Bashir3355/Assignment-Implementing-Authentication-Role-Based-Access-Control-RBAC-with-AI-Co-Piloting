<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authentication & RBAC Lab</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>Authentication & RBAC Lab</h1><p>Node.js + Express + bcrypt + server-side sessions</p><section><h2>Register or Log In</h2><label>Username <input id="username" autocomplete="username" minlength="3" maxlength="30" required></label><label>Password <input id="password" type="password" autocomplete="current-password" minlength="12" required></label><div><button id="register">Register (User)</button><button id="login">Log In</button><button id="logout">Log Out</button></div></section><section><h2>Test Access</h2><button id="public">Public (200)</button><button id="user">User Dashboard</button><button id="admin">Admin Dashboard</button><p>Open browser DevTools → Network to inspect HTTP 200, 401, and 403 responses.</p></section><section><h2>Server Response</h2><pre id="output" role="status" aria-live="polite">Ready.</pre></section></main><script src="/app.js"></script></body></html>
